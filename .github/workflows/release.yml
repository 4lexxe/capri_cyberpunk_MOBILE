name: Prepare signed release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Restore private signing material
        env:
          KEYSTORE: ${{ secrets.CAPRI_KEYSTORE_BASE64 }}
          LEGACY_KEYSTORE: ${{ secrets.CAPRI_LEGACY_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.CAPRI_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CAPRI_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.CAPRI_KEY_PASSWORD }}
        run: |
          python - <<'PY'
          import base64, os
          from pathlib import Path
          names = ['KEYSTORE', 'LEGACY_KEYSTORE', 'STORE_PASS', 'KEY_ALIAS', 'KEY_PASS']
          if not all(os.environ.get(name) for name in names):
              raise SystemExit('Configure the required CAPRI signing secrets, including the legacy keystore; no unsigned release is produced.')
          Path('signing').mkdir()
          Path('signing/capri-release.p12').write_bytes(base64.b64decode(os.environ['KEYSTORE'], validate=True))
          Path('signing/capri-legacy.keystore').write_bytes(base64.b64decode(os.environ['LEGACY_KEYSTORE'], validate=True))
          def prop(value):
              return value.replace('\\', '\\\\').replace('\n', '\\n').replace('\r', '\\r')
          Path('signing.properties').write_text('storeFile=signing/capri-release.p12\n' +
              '\n'.join(f'{key}={prop(os.environ[name])}' for key,name in
              [('storePassword','STORE_PASS'),('keyAlias','KEY_ALIAS'),('keyPassword','KEY_PASS')]) + '\n')
          PY
      - name: Download and verify fixed voice models
        run: python scripts/fetch-qwen.py
      - name: Test, lint and build complete signed APK
        run: bash ./gradlew :app:testReleaseUnitTest :app:lintRelease :app:assembleRelease -PbundleQwen=true --console=plain
      - name: Package distributable files
        env:
          PROD_STORE_PASS: ${{ secrets.CAPRI_STORE_PASSWORD }}
          PROD_KEY_PASS: ${{ secrets.CAPRI_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CAPRI_KEY_ALIAS }}
          LEGACY_PASS: ${{ secrets.CAPRI_LEGACY_STORE_PASSWORD }}
        run: |
          mkdir -p artifacts
          export LEGACY_SIGN_PASS="${LEGACY_PASS:-android}"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks signing/capri-legacy.keystore --ks-key-alias androiddebugkey \
            --ks-pass env:LEGACY_SIGN_PASS --key-pass env:LEGACY_SIGN_PASS \
            --next-signer --ks signing/capri-release.p12 --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:PROD_STORE_PASS --key-pass env:PROD_KEY_PASS \
            --lineage signing.lineage --rotation-min-sdk-version 28 \
            --v1-signing-enabled false --v2-signing-enabled true --v3-signing-enabled true --v4-signing-enabled false \
            --out artifacts/Capri-Android-1.0.0-completa.apk app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify artifacts/Capri-Android-1.0.0-completa.apk
          python scripts/package-source.py
          cd artifacts
          sha256sum *.apk *.zip > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Capri-Android-1.0.0-release
          path: artifacts/
          compression-level: 0
      - name: Remove private signing files from runner
        if: always()
        run: python -c "from pathlib import Path; [p.unlink(missing_ok=True) for p in [Path('signing.properties'),Path('signing/capri-release.p12'),Path('signing/capri-legacy.keystore')]]"
